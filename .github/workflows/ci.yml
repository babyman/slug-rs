name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt
      # slug.arcade builds its vendored raylib against X11 and OpenGL.
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl-dev
      - run: make stage-native-clutches
      - run: make ci

  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - run: make test-native
      - name: Test the typed filesystem clutch through the CLI
        if: runner.os != 'Windows'
        run: make test-filesystem-clutch

  embedded-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust for ESP32-S3
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          buildtargets: esp32s3
      - name: Check ESP32-S3 firmware
        run: cargo +esp check
        working-directory: firmware/slug-esp32-s3
      - name: Check ESP32-S3 firmware with a typed C provider
        run: cargo +esp check
        working-directory: firmware/slug-esp32-s3
        env:
          SLUG_TARGET_DESCRIPTOR: esp32-s3-typed.toml
      - name: Check the typed native adapter for ESP32-S3
        run: cargo +esp check -p slug-native-adapter --target xtensa-esp32s3-none-elf -Z build-std=core,alloc
