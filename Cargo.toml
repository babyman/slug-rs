[workspace]
members = [
    "crates/slug-vm",
    "crates/slug-frontend",
    "crates/slug-loader",
    "crates/slug-nil-loader",
    "crates/slug-restricted-host",
    "crates/slug-desktop-loader",
    "crates/slug",
    "crates/slug-server",
    "crates/slug-repl",
]
resolver = "3"

# Normal desktop/server Slug
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

# Embedded/size-constrained Slug
[profile.embedded]
inherits = "release"
opt-level = "z"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
