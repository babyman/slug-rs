[workspace]
members = [".", "crates/slug-server", "crates/slug-repl"]
resolver = "3"

[package]
name = "slug-vm"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "A clean-room Rust virtual machine for the Slug language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sluglang/slug"

[lib]
name = "slug_vm"
path = "src/lib.rs"

[features]
default = ["concurrency"]
concurrency = []
metrics = []

[[bin]]
name = "slug"
path = "src/main.rs"

[[bench]]
name = "vm"
harness = false
required-features = ["metrics"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
