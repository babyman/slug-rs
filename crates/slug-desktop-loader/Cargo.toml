[package]
name = "slug-desktop-loader"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Desktop external import loader for the Slug language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/babyman/slug-rs"

[lints]
workspace = true

[dependencies]
slug-loader = { path = "../slug-loader" }
slug-native-adapter = { path = "../slug-native-adapter" }
slug-native-manifest = { path = "../slug-native-manifest" }
slug-vm = { path = "../slug-vm", default-features = false }
toml = "0.8"
