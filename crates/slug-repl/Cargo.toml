[package]
name = "slug-repl"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Terminal client for the Slug interactive session server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sluglang/slug"

[features]
default = ["concurrency"]
concurrency = ["slug-server/concurrency"]
metrics = ["slug-server/metrics"]

[lints]
workspace = true

[dependencies]
rustyline = "17"
serde_json = "1"
slug-server = { path = "../slug-server", default-features = false }
