[package]
name = "slug-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Interactive session server for the Slug language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sluglang/slug"

[features]
default = ["concurrency"]
concurrency = ["slug-vm/concurrency"]
metrics = ["slug-vm/metrics"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slug-vm = { path = "../..", default-features = false }

[dev-dependencies]
slug-vm = { path = "../..", default-features = false }
