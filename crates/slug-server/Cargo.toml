[package]
name = "slug-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Interactive session server for the Slug language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sluglang/slug"

[features]
default = ["concurrency"]
concurrency = ["slug/concurrency"]
metrics = ["slug/metrics"]

[lints]
workspace = true

[dependencies]
slug = { path = "../slug", default-features = false }

[dev-dependencies]
serde_json = "1"
slug-vm = { path = "../slug-vm", default-features = false }
slug-frontend = { path = "../slug-frontend", default-features = false }
