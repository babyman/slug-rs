[package]
name = "slug-native-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Calls generated typed native shims for the Slug VM"
license = "MIT OR Apache-2.0"
repository = "https://github.com/babyman/slug-rs"

[lints]
workspace = true

[dependencies]
slug-vm = { path = "../slug-vm", default-features = false }

[dev-dependencies]
slug-frontend = { path = "../slug-frontend", default-features = false }
slug-loader = { path = "../slug-loader" }
slug-native-manifest = { path = "../slug-native-manifest" }
