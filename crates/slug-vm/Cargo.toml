[package]
name = "slug-vm"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "The reference virtual machine for the Slug language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/babyman/slug-rs"

[lib]
name = "slug_vm"

[features]
default = ["concurrency", "threads"]
concurrency = []
# Atomic reference counts, so forks can run on other threads.
threads = ["concurrency"]
metrics = []
# Entry counts per chunk and the hook a native-code tier installs
# (`slug-native-tier`). Desktop only.
native-hooks = ["threads"]

[lints]
workspace = true

[dev-dependencies]
slug-frontend = { path = "../slug-frontend", default-features = false }
slug-loader = { path = "../slug-loader" }
