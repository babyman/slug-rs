[package]
name = "slug-frontend"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Source frontend and module graph for the Slug language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sluglang/slug"

[features]
default = ["concurrency"]
concurrency = ["slug-vm/concurrency"]
metrics = ["slug-vm/metrics"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slug-loader = { path = "../slug-loader" }
slug-vm = { path = "../slug-vm", default-features = false }
slug-desktop-loader = { path = "../slug-desktop-loader", default-features = false }

[[bench]]
name = "vm"
harness = false
required-features = ["metrics"]

[[bench]]
name = "source"
harness = false
