[package]
name = "slug-restricted-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "In-memory restricted Slug host harness"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sluglang/slug"

[features]
default = ["concurrency"]
concurrency = ["slug-frontend/concurrency", "slug-vm/concurrency"]
metrics = ["slug-frontend/metrics", "slug-vm/metrics"]

[lints]
workspace = true

[dependencies]
slug-frontend = { path = "../slug-frontend", default-features = false }
slug-loader = { path = "../slug-loader" }
slug-nil-loader = { path = "../slug-nil-loader" }
slug-vm = { path = "../slug-vm", default-features = false }
