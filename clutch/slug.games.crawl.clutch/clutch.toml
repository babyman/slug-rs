# Crawl, the roguelike from eval/agent/projects/crawl, as a library: its
# engine (game, level, and data, from the eval's reference, reworked into
# an endless world of chunks with the game's state split into a world and a
# player, and rng, which draws from slug.random) and a web front end over slug.net.http and HTMX, which
# ships unchanged as assets/htmx.js (htmx 2.0.4, Zero-Clause BSD).
[modules]
"slug.games.crawl" = { source = "modules/game.slug" }
"slug.games.crawl.data" = { source = "modules/data.slug" }
"slug.games.crawl.rng" = { source = "modules/rng.slug" }
"slug.games.crawl.level" = { source = "modules/level.slug" }
"slug.games.crawl.web" = { source = "modules/web.slug" }

[tests]
files = ["tests/web.slug", "tests/world.slug", "tests/players.slug", "tests/tick.slug"]
