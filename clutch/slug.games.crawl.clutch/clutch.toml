# Crawl, the roguelike from eval/agent/projects/crawl, as a library: its
# engine (game, level, and data, from the eval's reference, reworked into
# a world of chunks, a surface over an endless dungeon, with the game's state
# split into a world and players, and rng, which draws from slug.random),
# towns and forts on the surface (town), monster populations (region),
# factions and territory (empire), what people tell of its history (lore), and
# a web front end over slug.net.http and HTMX, with the world saved in
# SQLite by store, through slug.db.sqlite; HTMX
# ships unchanged as assets/htmx.js (htmx 2.0.4, Zero-Clause BSD).
[modules]
"slug.games.crawl" = { source = "modules/game.slug" }
"slug.games.crawl.data" = { source = "modules/data.slug" }
"slug.games.crawl.rng" = { source = "modules/rng.slug" }
"slug.games.crawl.level" = { source = "modules/level.slug" }
"slug.games.crawl.web" = { source = "modules/web.slug" }
"slug.games.crawl.store" = { source = "modules/store.slug" }
"slug.games.crawl.town" = { source = "modules/town.slug" }
"slug.games.crawl.region" = { source = "modules/region.slug" }
"slug.games.crawl.empire" = { source = "modules/empire.slug" }
"slug.games.crawl.lore" = { source = "modules/lore.slug" }
"slug.games.crawl.bestiary" = { source = "modules/bestiary.slug" }

[tests]
files = ["tests/web.slug", "tests/world.slug", "tests/players.slug", "tests/tick.slug", "tests/store.slug", "tests/meeting.slug", "tests/towns.slug", "tests/regions.slug", "tests/empire.slug", "tests/history.slug", "tests/lore.slug", "tests/bestiary.slug"]
