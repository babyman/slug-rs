[modules]
"slug.io.fs" = { source = "modules/fs.slug" }

[tests]
files = ["tests/fs.slug"]

# Every operation runs on one native I/O thread and replies through a
# channel, so a slow disk parks only the task that is waiting on it.
[native]
profile = "events"
headers = ["native/source/slug_io_fs.h"]
sources = ["native/source/fs.c"]

[native.libraries]
"macos-aarch64" = "native/macos-aarch64/libslug_io_fs.dylib"
"macos-x86_64" = "native/macos-x86_64/libslug_io_fs.dylib"
"linux-x86_64" = "native/linux-x86_64/libslug_io_fs.so"

[native.resources."slug.io.fs".File]
type = "slug_fs_file"
release = { symbol = "slug_fs_release", signature = "(handle<File> file) -> void" }

[native.functions."slug.io.fs"]
openRaw = { symbol = "slug_fs_open", signature = "(cstr path, i64 mode, producer reply, out handle<File> file) -> i32" }
readRaw = { symbol = "slug_fs_read", signature = "(handle<File> file, i64 max_bytes, producer reply) -> i32" }
readLineRaw = { symbol = "slug_fs_read_line", signature = "(handle<File> file, producer reply) -> i32" }
writeRaw = { symbol = "slug_fs_write", signature = "(handle<File> file, bytes data, producer reply) -> i32" }
writeTextRaw = { symbol = "slug_fs_write_text", signature = "(handle<File> file, str text, producer reply) -> i32" }
syncRaw = { symbol = "slug_fs_sync", signature = "(handle<File> file, producer reply) -> i32" }
closeRaw = { symbol = "slug_fs_release", signature = "(close handle<File> file) -> void" }
statRaw = { symbol = "slug_fs_stat", signature = "(cstr path, producer reply) -> i32" }
listRaw = { symbol = "slug_fs_list", signature = "(cstr path, producer reply) -> i32" }
makeDirectoryRaw = { symbol = "slug_fs_make_directory", signature = "(cstr path, i64 parents, producer reply) -> i32" }
renameRaw = { symbol = "slug_fs_rename", signature = "(cstr from, cstr to, producer reply) -> i32" }
removeRaw = { symbol = "slug_fs_remove", signature = "(cstr path, producer reply) -> i32" }
removeAllRaw = { symbol = "slug_fs_remove_all", signature = "(cstr path, producer reply) -> i32" }
temporaryDirectoryRaw = { symbol = "slug_fs_temporary_directory", signature = "(cstr prefix, producer reply) -> i32" }
