[modules]
"slug.std" = { source = "modules/std.slug" }
"slug.io.stdin" = { source = "modules/stdin.slug" }
"slug.math" = { source = "modules/math.slug" }
"slug.string" = { source = "modules/string.slug" }
"slug.fmt.toml" = { source = "modules/toml.slug" }
"slug.fmt.json" = { source = "modules/json.slug" }
"slug.test" = { source = "modules/test.slug" }
"slug.random" = { source = "modules/random.slug" }

[tests]
files = ["tests/math.slug", "tests/string.slug", "tests/toml.slug", "tests/test.slug", "tests/json_suite.slug", "tests/json.slug", "tests/random.slug"]

[native]
profile = "events"
headers = ["native/source/slug_core.h"]
sources = ["native/source/core.c"]

[native.libraries]
"macos-aarch64" = "native/macos-aarch64/libslug_core.dylib"
"macos-x86_64" = "native/macos-x86_64/libslug_core.dylib"
"linux-x86_64" = "native/linux-x86_64/libslug_core.so"
"windows-x86_64" = "native/windows-x86_64/slug_core.dll"

[native.functions."slug.io.stdin"]
startReaderRaw = { symbol = "slug_core_start_reader", signature = "(producer lines) -> i32" }

[native.functions."slug.math"]
addRaw = { symbol = "slug_core_add", signature = "(i64 left, i64 right, out i64 sum) -> bool" }
sqrtRaw = { symbol = "slug_core_sqrt", signature = "(f64 value) -> f64" }

[native.functions."slug.string"]
ordRaw = { symbol = "slug_core_ord", signature = "(str character) -> i64" }
chrRaw = { symbol = "slug_core_chr", signature = "(i64 code, out str character) -> bool" }
fromBytesRaw = { symbol = "slug_core_from_bytes", signature = "(bytes data, out str text) -> bool" }
toBytesRaw = { symbol = "slug_core_to_bytes", signature = "(str text, out bytes data) -> void" }
